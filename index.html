<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo Virtual Card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <div class="top">
    <span class="badge">DEMO WALLET</span>
    <span class="status">● Demo mode</span>
  </div>

  <section class="card" aria-label="Demo virtual card">
    <div class="card-top">
      <div class="brand">VIRTUAL<br><small>CARD</small></div>
      <div class="chip"></div>
    </div>

    <div class="watermark">DEMO</div>

    <div class="number" id="cardNumber">5555 5555 5555 5555</div>

    <div class="card-bottom">
      <div>
        <label>CARD HOLDER</label>
        <div class="value" id="holder">DEMO USER</div>
      </div>
      <div>
        <label>EXPIRES</label>
        <div class="value">12/30</div>
      </div>
      <div>
        <label>CVV</label>
        <div class="value">123</div>
      </div>
    </div>
    <div class="notpay">DEMO — NOT FOR PAYMENT</div>
  </section>

  <section class="panel">
    <h2>Create a demo card</h2>
    <input id="name" maxlength="24" placeholder="Card holder name">
    <button id="generate">Generate Demo Card</button>
    <p id="msg"></p>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
