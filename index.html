<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Virtual Card Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <h1>Virtual Card</h1>
    <p class="notice">DEMO / TEST CARD — not a real payment card</p>

    <section class="card" aria-label="Demo virtual card">
      <div class="top">
        <span class="chip"></span>
        <span class="brand">MASTER<span>CARD</span></span>
      </div>

      <div class="number">9839 •••• •••• 3938</div>

      <div class="details">
        <div>
          <small>CARD HOLDER</small>
          <strong>MD ABDULLAH KHAN</strong>
        </div>
        <div>
          <small>VALID THRU</small>
          <strong>02/94</strong>
        </div>
      </div>
      <div class="demo-cvv">CVV •••</div>
      <div class="watermark">DEMO</div>
    </section>

    <p class="safe">For a real card, use the card issued by your bank/provider. Never publish a real CVV or full card number online.</p>
  </main>
</body>
</html>
